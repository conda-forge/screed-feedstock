{% set version = "1.1.3" %}

package:
  name: screed
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/screed/screed-{{ version }}.tar.gz
  sha256: 37e81697c7dba95a053554e5b5a86aff329705e1cf5dfc5e7b8da586dee072b8

build:
  noarch: python
  entry_points:
    - screed = screed.__main__:main
  number: 1
  script: {{ PYTHON }} -m pip install --no-deps -vv .

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=48
    - setuptools_scm
    - setuptools_scm_git_archive

  run:
    - python >={{ python_min }}
    - setuptools

test:
  imports:
    - screed
    - screed.tests

  commands:
    - screed --help

  requires:
    - pytest >=6.0
    - pytest-cov
    - python {{ python_min }}

about:
  home: http://github.com/dib-lab/screed/
  license: BSD-3-Clause
  summary: Screed is a biological sequence parsing and storage/retrieval library for DNA and protein sequences.
  license_family: BSD
  license_file: doc/LICENSE.rst
  dev_url: https://github.com/dib-lab/screed
  doc_url: https://screed.readthedocs.io/

extra:
  recipe-maintainers:
    - luizirber
    - ctb
